<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f2">

    <title>ChatStudio — пост</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f7f6f2;
            color: #1f1f1f;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 68px;
            background: rgba(247, 246, 242, .92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid #e7e4dd;
        }

        .topbar-inner {
            width: min(1180px, calc(100% - 32px));
            height: 100%;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-weight: 700;
            font-size: 19px;
            letter-spacing: -.4px;
        }

        .brand-mark {
            width: 31px;
            height: 31px;
            border-radius: 10px;

            background: #202020;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
        }

        .back-button {
            height: 40px;
            padding: 0 14px;

            border-radius: 11px;
            background: #ece9e3;
            color: #57534c;

            cursor: pointer;
            transition: .18s ease;
        }

        .back-button:hover {
            background: #dfdcd5;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            width: min(980px, calc(100% - 32px));
            margin: 0 auto;
            padding: 42px 0 100px;
        }

        .post-container {
            background: #fff;

            border: 1px solid #e5e2db;
            border-radius: 22px;

            overflow: hidden;
            box-shadow: 0 8px 35px rgba(0, 0, 0, .035);
        }

        .post-header {
            padding: 31px 34px 26px;
            border-bottom: 1px solid #ece9e2;
        }

        .author-line {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 19px;
        }

        .author-avatar {
            width: 36px;
            height: 36px;

            border-radius: 50%;
            background: #ece9e3;

            color: #5e5b55;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: 700;
        }

        .author-info {
            min-width: 0;
        }

        .author-name {
            font-size: 13px;
            font-weight: 650;
            color: #34322f;
        }

        .post-date {
            margin-top: 2px;
            font-size: 11px;
            color: #99958d;
        }

        .post-title {
            margin: 0;

            font-size: 31px;
            line-height: 1.22;
            letter-spacing: -1px;
            font-weight: 700;

            overflow-wrap: anywhere;
        }

        /* =========================
           BODY
        ========================= */

        .post-body {
            padding: 30px 34px 36px;
        }

        .section {
            margin-bottom: 32px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            margin-bottom: 11px;

            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;

            color: #99958d;
            font-weight: 700;
        }

        .prompt {
            padding: 18px;

            border-radius: 15px;
            background: #f5f3ee;

            color: #35322e;
            font-size: 15px;
            line-height: 1.65;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* =========================
           FILES
        ========================= */

        .files-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(190px, 1fr));

            gap: 12px;
        }

        .file-card {
            display: block;

            border: 1px solid #e1ded7;
            border-radius: 14px;

            background: #f6f4ef;

            overflow: hidden;

            transition: .18s ease;
        }

        .file-card:hover {
            border-color: #cfcac1;
            transform: translateY(-1px);
        }

        .file-image {
            width: 100%;
            height: 180px;

            object-fit: cover;
            display: block;

            background: #ebe8e1;
        }

        .file-document-preview {
            height: 115px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        .file-info {
            padding: 11px 12px;

            border-top: 1px solid #e4e1da;
        }

        .file-name {
            font-size: 12px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            margin-top: 4px;

            color: #99958d;
            font-size: 10px;
        }

        /* =========================
           ANSWER
        ========================= */

        .answer {
            color: #292723;

            font-size: 15px;
            line-height: 1.75;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .answer-empty {
            color: #99958d;
        }

        /* =========================
           FOOTER
        ========================= */

        .post-footer {
            padding: 18px 34px;

            border-top: 1px solid #ece9e2;

            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reaction {
            height: 36px;
            padding: 0 12px;

            border-radius: 10px;

            background: #f1efea;
            color: #625e57;

            display: flex;
            align-items: center;
            gap: 7px;

            cursor: pointer;

            font-size: 12px;

            transition: .15s ease;
        }

        .reaction:hover {
            background: #e7e4dc;
        }

        .reaction.active {
            background: #dedbd3;
            color: #282622;
        }

        .dislike {
            width: 38px;
            padding: 0;
            justify-content: center;
        }

        .model {
            margin-left: auto;

            color: #969189;
            font-size: 11px;
        }

        /* =========================
           STATES
        ========================= */

        .state {
            background: #fff;

            border: 1px solid #e5e2db;
            border-radius: 20px;

            padding: 70px 30px;

            text-align: center;
            color: #88847c;

            font-size: 14px;
        }

        .error {
            color: #a44e46;
            background: #fffafa;
            border-color: #ead5d1;
        }

        .skeleton {
            height: 500px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #eeeae4 25%,
                    #f8f6f2 50%,
                    #eeeae4 75%
                );

            background-size: 200% 100%;

            animation: skeleton 1.4s infinite;
        }

        @keyframes skeleton {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .topbar {
                height: 62px;
            }

            .topbar-inner {
                width: calc(100% - 20px);
            }

            .brand {
                font-size: 17px;
            }

            .back-button {
                font-size: 12px;
                height: 38px;
            }

            .main {
                width: 100%;
                padding: 0;
            }

            .post-container {
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            .post-header {
                padding: 25px 18px 22px;
            }

            .post-title {
                font-size: 24px;
                letter-spacing: -.7px;
            }

            .post-body {
                padding: 24px 18px 30px;
            }

            .post-footer {
                padding: 15px 18px;
            }

            .files-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .file-image {
                height: 135px;
            }

            .model {
                width: 100%;
                margin-left: 0;
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <a
            href="/"
            class="brand"
        >
            <span class="brand-mark">C</span>
            <span>ChatStudio</span>
        </a>

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ← Назад
        </button>

    </div>

</header>


<main class="main">

    <div id="stateContainer">

        <div class="skeleton"></div>

    </div>

</main>


<script>
/* =========================================================
   CONFIG
========================================================= */

const API = {
    posts: "/api/posts",
    view: id =>
        `/api/posts/${encodeURIComponent(id)}/view`,
    like: id =>
        `/api/posts/${encodeURIComponent(id)}/like`,
    dislike: id =>
        `/api/posts/${encodeURIComponent(id)}/dislike`
};


/* =========================================================
   STATE
========================================================= */

const state = {
    post: null
};


/* =========================================================
   SESSION
========================================================= */

function getSessionId() {

    let id =
        sessionStorage.getItem(
            "chatstudio_session_id"
        );

    if (!id) {

        id =
            crypto.randomUUID
                ? crypto.randomUUID()
                : (
                    Date.now().toString(36) +
                    Math.random()
                        .toString(36)
                        .slice(2)
                );

        sessionStorage.setItem(
            "chatstudio_session_id",
            id
        );
    }

    return id;
}

const SESSION_ID =
    getSessionId();


/* =========================================================
   REACTIONS
========================================================= */

function reactionKey(
    type,
    id
) {
    return `chatstudio_${type}_${id}`;
}


function hasReaction(
    type,
    id
) {
    return (
        sessionStorage.getItem(
            reactionKey(type, id)
        ) === "1"
    );
}


function setReaction(
    type,
    id
) {
    sessionStorage.setItem(
        reactionKey(type, id),
        "1"
    );
}


/* =========================================================
   API
========================================================= */

async function apiFetch(
    url,
    options = {}
) {

    const headers =
        new Headers(
            options.headers || {}
        );

    headers.set(
        "X-Session-ID",
        SESSION_ID
    );

    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    let data = null;

    const contentType =
        response.headers.get(
            "content-type"
        ) || "";

    if (
        contentType.includes(
            "application/json"
        )
    ) {

        try {
            data =
                await response.json();
        } catch {
            data = null;
        }

    } else {

        try {
            data =
                await response.text();
        } catch {
            data = null;
        }
    }

    if (!response.ok) {

        const error =
            new Error(
                data?.detail ||
                data?.error ||
                data?.message ||
                `Ошибка ${response.status}`
            );

        error.status =
            response.status;

        error.data =
            data;

        throw error;
    }

    return data;
}


/* =========================================================
   GET POST ID
========================================================= */

function getPostId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("post")
    );
}


/* =========================================================
   LOAD POST
========================================================= */

async function loadPost() {

    const id =
        getPostId();

    if (!id) {

        renderError(
            "Пост не указан."
        );

        return;
    }

    try {

        const data =
            await apiFetch(
                `${API.posts}/${encodeURIComponent(id)}`
            );

        const post =
            normalizePost(
                data?.post ||
                data
            );

        if (!post) {
            throw new Error(
                "Пост не найден."
            );
        }

        state.post =
            post;

        renderPost(post);

        await registerView(post);

    } catch (error) {

        console.error(error);

        renderError(
            error.message ||
            "Не удалось загрузить пост."
        );
    }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizePost(post) {

    if (!post || !post.id) {
        return null;
    }

    return {

        id: post.id,

        title:
            post.title ||
            createTitle(
                post.prompt ||
                ""
            ),

        author:
            post.author_name ||
            post.author ||
            "Аноним",

        prompt:
            post.prompt ||
            post.request ||
            "",

        answer:
            post.answer ||
            post.response ||
            "",

        files:
            Array.isArray(post.files)
                ? post.files
                : [],

        likes:
            Number(
                post.likes || 0
            ),

        views:
            Number(
                post.views || 0
            ),

        model:
            post.model ||
            post.model_name ||
            "",

        createdAt:
            post.created_at ||
            post.createdAt ||
            null,

        liked:
            Boolean(
                post.liked ||
                hasReaction(
                    "like",
                    post.id
                )
            ),

        disliked:
            Boolean(
                post.disliked ||
                hasReaction(
                    "dislike",
                    post.id
                )
            )
    };
}


/* =========================================================
   VIEW
========================================================= */

async function registerView(post) {

    if (
        hasReaction(
            "view",
            post.id
        )
    ) {
        return;
    }

    /*
     * Сразу записываем в sessionStorage,
     * чтобы двойной клик не дал два просмотра.
     */
    setReaction(
        "view",
        post.id
    );

    post.views =
        Number(post.views || 0) + 1;

    renderPost(post);

    try {

        const data =
            await apiFetch(
                API.view(post.id),
                {
                    method: "POST"
                }
            );

        if (
            data &&
            data.views !== undefined
        ) {

            post.views =
                Number(data.views);

            renderPost(post);
        }

    } catch (error) {

        console.warn(
            "Не удалось записать просмотр:",
            error
        );
    }
}


/* =========================================================
   LIKE
========================================================= */

async function likePost() {

    const post =
        state.post;

    if (!post) {
        return;
    }

    if (
        hasReaction(
            "like",
            post.id
        )
    ) {
        return;
    }

    setReaction(
        "like",
        post.id
    );

    post.liked = true;

    post.likes =
        Number(post.likes || 0) + 1;

    renderPost(post);

    try {

        const data =
            await apiFetch(
                API.like(post.id),
                {
                    method: "POST"
                }
            );

        if (
            data &&
            data.likes !== undefined
        ) {

            post.likes =
                Number(data.likes);

            renderPost(post);
        }

    } catch (error) {

        console.warn(
            "Ошибка лайка:",
            error
        );

        sessionStorage.removeItem(
            reactionKey(
                "like",
                post.id
            )
        );

        post.liked = false;

        post.likes =
            Math.max(
                0,
                Number(post.likes || 1) - 1
            );

        renderPost(post);
    }
}


/* =========================================================
   DISLIKE
========================================================= */

async function dislikePost() {

    const post =
        state.post;

    if (!post) {
        return;
    }

    if (
        hasReaction(
            "dislike",
            post.id
        )
    ) {
        return;
    }

    setReaction(
        "dislike",
        post.id
    );

    post.disliked = true;

    renderPost(post);

    try {

        await apiFetch(
            API.dislike(post.id),
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.warn(
            "Ошибка дизлайка:",
            error
        );

        sessionStorage.removeItem(
            reactionKey(
                "dislike",
                post.id
            )
        );

        post.disliked = false;

        renderPost(post);
    }
}


/* =========================================================
   RENDER POST
========================================================= */

function renderPost(post) {

    const container =
        document.getElementById(
            "stateContainer"
        );

    const liked =
        post.liked ||
        hasReaction(
            "like",
            post.id
        );

    const disliked =
        post.disliked ||
        hasReaction(
            "dislike",
            post.id
        );

    container.innerHTML = `

        <article class="post-container">

            <header class="post-header">

                <div class="author-line">

                    <div class="author-avatar">
                        ${escapeHtml(
                            getAvatar(post.author)
                        )}
                    </div>

                    <div class="author-info">

                        <div class="author-name">
                            ${escapeHtml(
                                post.author
                            )}
                        </div>

                        <div class="post-date">
                            ${escapeHtml(
                                formatDate(
                                    post.createdAt
                                )
                            )}
                        </div>

                    </div>

                </div>

                <h1 class="post-title">
                    ${escapeHtml(
                        post.title
                    )}
                </h1>

            </header>


            <div class="post-body">

                <section class="section">

                    <div class="section-label">
                        Запрос
                    </div>

                    <div class="prompt">
                        ${escapeHtml(
                            post.prompt
                        )}
                    </div>

                </section>


                ${
                    post.files.length
                        ? `
                            <section class="section">

                                <div class="section-label">
                                    Файлы · ${post.files.length}
                                </div>

                                <div class="files-grid">

                                    ${
                                        post.files
                                            .map(
                                                renderFile
                                            )
                                            .join("")
                                    }

                                </div>

                            </section>
                        `
                        : ""
                }


                <section class="section">

                    <div class="section-label">
                        Ответ ИИ
                    </div>

                    <div class="answer">

                        ${
                            post.answer
                                ? escapeHtml(
                                    post.answer
                                )
                                : `
                                    <span class="answer-empty">
                                        Ответ отсутствует.
                                    </span>
                                `
                        }

                    </div>

                </section>

            </div>


            <footer class="post-footer">

                <button
                    id="likeButton"
                    class="reaction ${
                        liked
                            ? "active"
                            : ""
                    }"
                    type="button"
                >
                    👍
                    <span>
                        ${post.likes}
                    </span>
                </button>

                <button
                    id="dislikeButton"
                    class="reaction dislike ${
                        disliked
                            ? "active"
                            : ""
                    }"
                    type="button"
                    aria-label="Дизлайк"
                >
                    👎
                </button>

                <div class="reaction">
                    👁
                    <span>
                        ${post.views}
                    </span>
                </div>

                ${
                    post.model
                        ? `
                            <div class="model">
                                Модель: ${
                                    escapeHtml(
                                        post.model
                                    )
                                }
                            </div>
                        `
                        : ""
                }

            </footer>

        </article>
    `;


    document
        .getElementById(
            "likeButton"
        )
        .addEventListener(
            "click",
            likePost
        );


    document
        .getElementById(
            "dislikeButton"
        )
        .addEventListener(
            "click",
            dislikePost
        );
}


/* =========================================================
   FILE
========================================================= */

function renderFile(file) {

    const name =
        file.name ||
        file.filename ||
        "Файл";

    const url =
        getFileUrl(file);

    const type =
        file.mime_type ||
        file.type ||
        getExtension(name);

    const isImage =
        file.is_image ||
        isImageFile(
            name,
            type
        );

    if (
        isImage &&
        url
    ) {

        return `
            <a
                class="file-card"
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener"
            >

                <img
                    class="file-image"
                    src="${escapeAttribute(url)}"
                    alt="${escapeAttribute(name)}"
                    loading="lazy"
                >

                <div class="file-info">

                    <div class="file-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="file-meta">
                        ${escapeHtml(type)}
                    </div>

                </div>

            </a>
        `;
    }

    return `
        <a
            class="file-card"
            href="${escapeAttribute(
                url || "#"
            )}"
            target="_blank"
            rel="noopener"
        >

            <div class="file-document-preview">
                ${getIcon(name)}
            </div>

            <div class="file-info">

                <div class="file-name">
                    ${escapeHtml(name)}
                </div>

                <div class="file-meta">
                    ${escapeHtml(type)}
                    ${
                        file.size
                            ? " · " +
                              escapeHtml(
                                  formatBytes(
                                      file.size
                                  )
                              )
                            : ""
                    }
                </div>

            </div>

        </a>
    `;
}


/* =========================================================
   HELPERS
========================================================= */

function getFileUrl(file) {

    return (
        file?.url ||
        file?.download_url ||
        file?.file_url ||
        file?.path ||
        ""
    );
}


function getExtension(name) {

    const parts =
        String(name)
            .split(".");

    if (
        parts.length < 2
    ) {
        return "Файл";
    }

    return parts
        .pop()
        .toUpperCase();
}


function getIcon(name) {

    const ext =
        getExtension(name);

    const icons = {

        PDF: "📄",

        DOC: "📄",
        DOCX: "📄",

        TXT: "📝",

        XLS: "📊",
        XLSX: "📊",
        CSV: "📊",

        PPT: "📊",
        PPTX: "📊",

        ZIP: "🗜️",
        RAR: "🗜️",

        PNG: "🖼️",
        JPG: "🖼️",
        JPEG: "🖼️",
        WEBP: "🖼️",
        GIF: "🖼️",

        MP3: "🎵",
        WAV: "🎵",

        MP4: "🎬",
        MOV: "🎬"
    };

    return (
        icons[ext] ||
        "📎"
    );
}


function isImageFile(
    name,
    mime
) {

    if (
        String(mime)
            .toLowerCase()
            .startsWith(
                "image/"
            )
    ) {
        return true;
    }

    return [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "bmp",
        "svg"
    ].includes(
        getExtension(name)
            .toLowerCase()
    );
}


function getAvatar(name) {

    const clean =
        String(
            name || "Аноним"
        ).trim();

    return (
        clean.charAt(0)
            .toUpperCase() ||
        "А"
    );
}


function createTitle(prompt) {

    const clean =
        String(prompt || "")
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    if (!clean) {
        return "Без названия";
    }

    if (
        clean.length <= 70
    ) {
        return clean;
    }

    return (
        clean.slice(0, 67) +
        "..."
    );
}


function formatDate(value) {

    if (!value) {
        return "только что";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "только что";
    }

    return date.toLocaleString(
        "ru-RU",
        {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function formatBytes(bytes) {

    if (!bytes) {
        return "";
    }

    const units = [
        "Б",
        "КБ",
        "МБ",
        "ГБ"
    ];

    let value =
        Number(bytes);

    let unit = 0;

    while (
        value >= 1024 &&
        unit <
            units.length - 1
    ) {

        value /= 1024;
        unit++;
    }

    return (
        value < 10 &&
        unit > 0
            ? value.toFixed(1)
            : Math.round(value)
    ) +
    " " +
    units[unit];
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function escapeAttribute(value) {

    return escapeHtml(value);
}
