<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f6f2">

    <title>ChatStudio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f7f6f2;
            color: #1f1f1f;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        ::selection {
            background: #dedbd2;
        }

        /* =========================
           APP
        ========================= */

        .app {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 68px;
            background: rgba(247, 246, 242, 0.92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid #e7e4dd;
        }

        .topbar-inner {
            width: min(1180px, calc(100% - 32px));
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #171717;
            text-decoration: none;
            font-weight: 700;
            font-size: 19px;
            letter-spacing: -0.4px;
            flex-shrink: 0;
        }

        .brand-mark {
            width: 31px;
            height: 31px;
            border-radius: 10px;
            background: #202020;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .header-search {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .header-search input {
            width: 100%;
            height: 42px;
            border: 1px solid #dfdcd5;
            background: #eeece7;
            border-radius: 13px;
            outline: none;
            padding: 0 44px 0 42px;
            color: #222;
            transition: .18s ease;
        }

        .header-search input:focus {
            background: #fff;
            border-color: #c8c4bb;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .035);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #77736c;
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: transparent;
            color: #777;
            cursor: pointer;
            display: none;
        }

        .clear-search:hover {
            background: #ddd9d1;
        }

        .new-header-button {
            height: 42px;
            padding: 0 16px;
            border-radius: 12px;
            background: #202020;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
            transition: .18s ease;
        }

        .new-header-button:hover {
            background: #363636;
            transform: translateY(-1px);
        }

        /* =========================
           CONTENT
        ========================= */

        .main {
            width: min(860px, calc(100% - 32px));
            margin: 0 auto;
            padding: 38px 0 120px;
        }

        .feed-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 23px;
        }

        .feed-title {
            margin: 0;
            font-size: 28px;
            line-height: 1.1;
            letter-spacing: -1px;
            font-weight: 700;
        }

        .feed-subtitle {
            color: #85817a;
            font-size: 14px;
            margin-top: 7px;
        }

        .refresh-button {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: #ece9e3;
            color: #595650;
            cursor: pointer;
            transition: .18s;
        }

        .refresh-button:hover {
            background: #dfdcd5;
        }

        .refresh-button.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           POST CARD
        ========================= */

        .feed {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .post-card {
            background: #fff;
            border: 1px solid #e5e2db;
            border-radius: 18px;
            padding: 22px;
            cursor: pointer;
            transition:
                transform .16s ease,
                box-shadow .16s ease,
                border-color .16s ease;
        }

        .post-card:hover {
            transform: translateY(-1px);
            border-color: #d8d4cc;
            box-shadow: 0 7px 24px rgba(0, 0, 0, .045);
        }

        .post-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .author-line {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .author-avatar {
            width: 31px;
            height: 31px;
            flex: 0 0 31px;
            border-radius: 50%;
            background: #ece9e3;
            color: #5e5b55;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }

        .author-name {
            font-size: 13px;
            font-weight: 600;
            color: #34322f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-time {
            color: #99958d;
            font-size: 12px;
            white-space: nowrap;
        }

        .post-title {
            margin: 0 0 9px;
            font-size: 19px;
            line-height: 1.3;
            letter-spacing: -.35px;
            font-weight: 650;
        }

        .post-prompt {
            margin: 0;
            color: #5f5b55;
            font-size: 14px;
            line-height: 1.58;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .post-answer-preview {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #efede8;
            color: #363430;
            font-size: 14px;
            line-height: 1.58;
            white-space: pre-wrap;
            overflow-wrap: anywhere;

            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
            overflow: hidden;
        }

        .files-strip {
            display: flex;
            gap: 9px;
            overflow-x: auto;
            padding: 2px 1px 5px;
            margin-top: 15px;
            scrollbar-width: thin;
        }

        .files-strip::-webkit-scrollbar {
            height: 5px;
        }

        .files-strip::-webkit-scrollbar-thumb {
            background: #d4d0c8;
            border-radius: 20px;
        }

        .file-mini {
            width: 105px;
            height: 82px;
            min-width: 105px;
            border: 1px solid #e3e0d9;
            border-radius: 12px;
            background: #f7f6f2;
            overflow: hidden;
            position: relative;
        }

        .file-mini.image {
            background: #eee;
        }

        .file-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-mini-icon {
            width: 100%;
            height: 49px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .file-mini-name {
            padding: 5px 8px;
            font-size: 10px;
            color: #68645d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-footer {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .reaction-button {
            height: 33px;
            padding: 0 10px;
            border-radius: 9px;
            background: #f4f2ed;
            color: #68645d;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: .15s;
        }

        .reaction-button:hover {
            background: #eae7e0;
        }

        .reaction-button.active {
            background: #dedbd3;
            color: #292824;
        }

        .dislike-button {
            width: 34px;
            padding: 0;
            justify-content: center;
        }

        .model-badge {
            margin-left: auto;
            color: #9a968e;
            font-size: 11px;
            white-space: nowrap;
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .loading-box,
        .empty-box,
        .error-box {
            border: 1px solid #e4e1da;
            border-radius: 18px;
            background: #fff;
            padding: 55px 25px;
            text-align: center;
            color: #88847c;
            font-size: 14px;
        }

        .error-box {
            color: #a44e46;
            background: #fffafa;
            border-color: #ead5d1;
        }

        .skeleton {
            height: 190px;
            border-radius: 18px;
            background:
                linear-gradient(
                    90deg,
                    #eeeae4 25%,
                    #f8f6f2 50%,
                    #eeeae4 75%
                );
            background-size: 200% 100%;
            animation: skeleton 1.4s infinite;
        }

        @keyframes skeleton {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        /* =========================
           FLOATING NEW BUTTON
        ========================= */

        .floating-new {
            position: fixed;
            right: 28px;
            bottom: 26px;
            z-index: 90;
            height: 50px;
            padding: 0 19px;
            border-radius: 15px;
            background: #202020;
            color: #fff;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .15);
            cursor: pointer;
            font-weight: 600;
            transition: .18s;
        }

        .floating-new:hover {
            background: #353535;
            transform: translateY(-2px);
        }

        /* =========================
           OVERLAY / MODALS
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(25, 24, 22, .38);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .overlay.open {
            display: flex;
        }

        .modal {
            width: min(720px, 100%);
            max-height: min(850px, calc(100vh - 36px));
            overflow-y: auto;
            background: #fdfcf9;
            border: 1px solid #e2ded6;
            border-radius: 23px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .17);
            position: relative;
        }

        .modal.large {
            width: min(1050px, 100%);
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 2;
            height: 64px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(253, 252, 249, .94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #ebe8e1;
        }

        .modal-header-title {
            font-size: 17px;
            font-weight: 650;
        }

        .close-button {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #eeece6;
            color: #57534c;
            cursor: pointer;
            font-size: 21px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button:hover {
            background: #e3e0d8;
        }

        .modal-content {
            padding: 25px;
        }

        /* =========================
           NEW POST
        ========================= */

        .field {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            margin-bottom: 8px;
            color: #3b3935;
            font-size: 13px;
            font-weight: 600;
        }

        .text-input,
        .text-area {
            width: 100%;
            border: 1px solid #dedbd4;
            background: #f7f6f2;
            border-radius: 13px;
            outline: none;
            color: #252421;
            transition: .18s;
        }

        .text-input {
            height: 46px;
            padding: 0 14px;
        }

        .text-area {
            min-height: 180px;
            resize: vertical;
            padding: 14px;
            line-height: 1.55;
        }

        .text-input:focus,
        .text-area:focus {
            background: #fff;
            border-color: #bab6ad;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .035);
        }

        .composer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-top: 14px;
        }

        .attach-button {
            height: 42px;
            padding: 0 14px;
            border-radius: 11px;
            background: #ece9e3;
            color: #4e4b46;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .attach-button:hover {
            background: #e1ded7;
        }

        .send-button {
            min-width: 120px;
            height: 44px;
            border-radius: 12px;
            background: #202020;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: .18s;
        }

        .send-button:hover:not(:disabled) {
            background: #363636;
        }

        .send-button:disabled {
            opacity: .48;
            cursor: not-allowed;
        }

        .file-preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 13px;
        }

        .selected-file {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            padding: 8px 8px 8px 11px;
            background: #efede8;
            border-radius: 10px;
            color: #57534c;
            font-size: 12px;
        }

        .selected-file-name {
            max-width: 240px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-file {
            width: 23px;
            height: 23px;
            border-radius: 7px;
            background: #e0ddd6;
            cursor: pointer;
            color: #625e57;
        }

        .remove-file:hover {
            background: #d5d1c8;
        }

        .upload-note {
            margin-top: 8px;
            color: #969189;
            font-size: 11px;
        }

        .cooldown-box {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 11px;
            background: #f0eee9;
            color: #69655e;
            font-size: 12px;
            display: none;
        }

        .cooldown-box.visible {
            display: block;
        }

        .submit-status {
            margin-top: 14px;
            font-size: 13px;
            color: #78746d;
            display: none;
        }

        .submit-status.visible {
            display: block;
        }

        /* =========================
           FULL POST
        ========================= */

        .full-post {
            padding: 28px 32px 38px;
        }

        .full-post-title {
            margin: 0 0 9px;
            font-size: 28px;
            line-height: 1.25;
            letter-spacing: -.8px;
        }

        .full-post-meta {
            color: #8b877f;
            font-size: 12px;
            margin-bottom: 26px;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: #9b978f;
            font-weight: 700;
            margin-bottom: 9px;
        }

        .full-prompt {
            background: #f5f3ee;
            border-radius: 14px;
            padding: 16px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.62;
            font-size: 14px;
            color: #35322e;
            margin-bottom: 26px;
        }

        .full-files {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }

        .full-file {
            border: 1px solid #e1ded7;
            border-radius: 14px;
            background: #f6f4ef;
            overflow: hidden;
            min-height: 115px;
        }

        .full-file-image {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
        }

        .full-file-document {
            height: 95px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
        }

        .full-file-info {
            padding: 10px 12px;
            border-top: 1px solid #e5e2db;
        }

        .full-file-name {
            font-size: 12px;
            font-weight: 600;
            color: #4b4842;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .full-file-type {
            color: #969189;
            font-size: 10px;
            margin-top: 3px;
        }

        .full-answer {
            font-size: 15px;
            line-height: 1.72;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #292723;
        }

        .full-answer code {
            background: #efede8;
            padding: 2px 5px;
            border-radius: 5px;
        }

        .post-details-footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid #e8e5de;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .model-info {
            margin-left: auto;
            color: #9a968e;
            font-size: 11px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {
            .topbar {
                height: auto;
            }

            .topbar-inner {
                width: calc(100% - 20px);
                min-height: 62px;
                padding: 9px 0;
                flex-wrap: wrap;
            }

            .brand {
                font-size: 17px;
            }

            .header-search {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .new-header-button {
                padding: 0 11px;
                font-size: 12px;
            }

            .main {
                width: calc(100% - 20px);
                padding-top: 25px;
            }

            .feed-title {
                font-size: 24px;
            }

            .post-card {
                padding: 17px;
                border-radius: 16px;
            }

            .post-title {
                font-size: 17px;
            }

            .post-answer-preview {
                -webkit-line-clamp: 3;
            }

            .floating-new {
                right: 15px;
                bottom: 15px;
                height: 47px;
                padding: 0 15px;
            }

            .overlay {
                padding: 0;
            }

            .modal,
            .modal.large {
                width: 100%;
                height: 100%;
                max-height: none;
                border-radius: 0;
                border: 0;
            }

            .modal-header {
                height: 59px;
            }

            .modal-content {
                padding: 19px;
            }

            .full-post {
                padding: 22px 18px 35px;
            }

            .full-post-title {
                font-size: 23px;
            }

            .full-files {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .composer-bottom {
                align-items: stretch;
                flex-direction: column;
            }

            .attach-button,
            .send-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="topbar">
        <div class="topbar-inner">

            <a href="#" class="brand" id="brandLink">
                <span class="brand-mark">C</span>
                <span>ChatStudio</span>
            </a>

            <div class="header-search">
                <span class="search-icon">⌕</span>

                <input
                    id="searchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="Поиск по постам..."
                >

                <button
                    id="clearSearch"
                    class="clear-search"
                    type="button"
                    aria-label="Очистить поиск"
                >×</button>
            </div>

            <button
                id="headerNewButton"
                class="new-header-button"
                type="button"
            >
                ＋ Новый
            </button>

        </div>
    </header>

    <!-- MAIN -->
    <main class="main">

        <div class="feed-title-row">
            <div>
                <h1 class="feed-title">Общая лента</h1>
                <div class="feed-subtitle" id="feedSubtitle">
                    Запросы и ответы сообщества
                </div>
            </div>

            <button
                id="refreshButton"
                class="refresh-button"
                type="button"
                title="Обновить"
            >
                ↻
            </button>
        </div>

        <section id="feed" class="feed">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </section>

    </main>

    <button
        id="floatingNewButton"
        class="floating-new"
        type="button"
    >
        ＋ Новое сообщение
    </button>

</div>


<!-- =====================================================
     NEW POST MODAL
===================================================== -->

<div
    id="newPostOverlay"
    class="overlay"
    aria-hidden="true"
>

    <div class="modal">

        <div class="modal-header">
            <div class="modal-header-title">
                Новое сообщение
            </div>

            <button
                id="closeNewPost"
                class="close-button"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>
        </div>

        <div class="modal-content">

            <form id="newPostForm">

                <div class="field">

                    <label
                        class="field-label"
                        for="authorName"
                    >
                        Имя
                    </label>

                    <input
                        id="authorName"
                        class="text-input"
                        type="text"
                        maxlength="80"
                        autocomplete="off"
                        placeholder="Как вас называть?"
                        required
                    >

                </div>

                <div class="field">

                    <label
                        class="field-label"
                        for="promptInput"
                    >
                        Ваш запрос
                    </label>

                    <textarea
                        id="promptInput"
                        class="text-area"
                        maxlength="30000"
                        placeholder="Напишите, что нужно сделать..."
                        required
                    ></textarea>

                </div>

                <div class="field">

                    <label class="field-label">
                        Файлы
                    </label>

                    <input
                        id="fileInput"
                        type="file"
                        multiple
                        hidden
                    >

                    <button
                        id="attachButton"
                        class="attach-button"
                        type="button"
                    >
                        📎 Прикрепить файлы
                    </button>

                    <div
                        id="selectedFiles"
                        class="file-preview-list"
                    ></div>

                    <div class="upload-note" id="uploadNote">
                        Максимальный размер и допустимые типы задаются сервером.
                    </div>

                </div>

                <div
                    id="cooldownBox"
                    class="cooldown-box"
                >
                    Следующее сообщение можно отправить через
                    <strong id="cooldownValue">30</strong> сек.
                </div>

                <div
                    id="submitStatus"
                    class="submit-status"
                ></div>

                <div class="composer-bottom">

                    <button
                        id="attachButtonBottom"
                        class="attach-button"
                        type="button"
                    >
                        📎 Файлы
                    </button>

                    <button
                        id="sendButton"
                        class="send-button"
                        type="submit"
                    >
                        Отправить
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- =====================================================
     FULL POST MODAL
===================================================== -->

<div
    id="postOverlay"
    class="overlay"
    aria-hidden="true"
>

    <div class="modal large">

        <div class="modal-header">

            <div class="modal-header-title">
                Просмотр поста
            </div>

            <button
                id="closePost"
                class="close-button"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>

        </div>

        <div
            id="fullPostContent"
            class="full-post"
        ></div>

    </div>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

const API = {
    posts: "/api/posts",
    search: "/api/posts/search",
    create: "/api/posts",
    like: id => `/api/posts/${encodeURIComponent(id)}/like`,
    dislike: id => `/api/posts/${encodeURIComponent(id)}/dislike`,
    view: id => `/api/posts/${encodeURIComponent(id)}/view`,
    file: url => url
};

const CONFIG = {
    cooldownSeconds: 30,

    /*
     * Клиентские ограничения нужны только для удобства.
     * Реальные ограничения ОБЯЗАТЕЛЬНО должен проверять backend.
     *
     * Сейчас значения специально большие.
     * Backend может вернуть точные ограничения.
     */
    maxFiles: 20,
    maxClientFileSize: 100 * 1024 * 1024,
    maxClientTotalSize: 500 * 1024 * 1024
};


/* =========================================================
   STATE
========================================================= */

const state = {
    posts: [],
    selectedFiles: [],
    searchTimer: null,
    cooldownTimer: null,
    cooldownUntil: Number(localStorage.getItem("chatstudio_cooldown_until") || 0),
    currentPostId: null,
    loadingFeed: false
};


/* =========================================================
   DOM
========================================================= */

const feed = document.getElementById("feed");
const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");
const refreshButton = document.getElementById("refreshButton");

const newPostOverlay = document.getElementById("newPostOverlay");
const postOverlay = document.getElementById("postOverlay");

const closeNewPost = document.getElementById("closeNewPost");
const closePost = document.getElementById("closePost");

const newPostForm = document.getElementById("newPostForm");
const authorName = document.getElementById("authorName");
const promptInput = document.getElementById("promptInput");

const fileInput = document.getElementById("fileInput");
const attachButton = document.getElementById("attachButton");
const attachButtonBottom = document.getElementById("attachButtonBottom");

const selectedFiles = document.getElementById("selectedFiles");

const sendButton = document.getElementById("sendButton");
const submitStatus = document.getElementById("submitStatus");

const cooldownBox = document.getElementById("cooldownBox");
const cooldownValue = document.getElementById("cooldownValue");

const fullPostContent = document.getElementById("fullPostContent");


/* =========================================================
   SESSION ID
========================================================= */

function getSessionId() {

    let id = sessionStorage.getItem("chatstudio_session_id");

    if (!id) {

        id =
            crypto.randomUUID
                ? crypto.randomUUID()
                : (
                    Date.now().toString(36) +
                    Math.random().toString(36).slice(2)
                );

        sessionStorage.setItem(
            "chatstudio_session_id",
            id
        );
    }

    return id;
}

const SESSION_ID = getSessionId();


/* =========================================================
   SESSION REACTIONS
========================================================= */

function getReactionKey(type, postId) {
    return `chatstudio_${type}_${postId}`;
}

function hasReaction(type, postId) {
    return sessionStorage.getItem(
        getReactionKey(type, postId)
    ) === "1";
}

function saveReaction(type, postId) {
    sessionStorage.setItem(
        getReactionKey(type, postId),
        "1"
    );
}


/* =========================================================
   API HELPER
========================================================= */

async function apiFetch(
    url,
    options = {}
) {

    const headers = new Headers(
        options.headers || {}
    );

    /*
     * Передаём session ID backend.
     * Backend может использовать его для:
     * - просмотров;
     * - лайков;
     * - дизлайков;
     * - cooldown.
     */
    headers.set(
        "X-Session-ID",
        SESSION_ID
    );

    const response = await fetch(
        url,
        {
            ...options,
            headers
        }
    );

    let data = null;

    const contentType =
        response.headers.get("content-type") || "";

    if (contentType.includes("application/json")) {

        try {
            data = await response.json();
        } catch {
            data = null;
        }

    } else {

        try {
            data = await response.text();
        } catch {
            data = null;
        }
    }

    if (!response.ok) {

        const error =
            new Error(
                data?.detail ||
                data?.error ||
                data?.message ||
                `Ошибка сервера: ${response.status}`
            );

        error.status = response.status;
        error.data = data;

        throw error;
    }

    return data;
}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed() {

    if (state.loadingFeed) {
        return;
    }

    state.loadingFeed = true;

    refreshButton.classList.add("loading");

    if (!state.posts.length) {
        renderLoading();
    }

    try {

        const data = await apiFetch(
            API.posts
        );

        state.posts =
            normalizePosts(
                Array.isArray(data)
                    ? data
                    : data?.posts || []
            );

        renderFeed();

    } catch (error) {

        console.error(error);

        renderError(
            "Не удалось загрузить ленту."
        );

    } finally {

        state.loadingFeed = false;

        refreshButton.classList.remove(
            "loading"
        );
    }
}


/* =========================================================
   SEARCH
========================================================= */

async function searchPosts(query) {

    const q = query.trim();

    if (!q) {
        await loadFeed();
        return;
    }

    feed.innerHTML = `
        <div class="loading-box">
            Ищем посты...
        </div>
    `;

    try {

        const url =
            `${API.search}?q=${encodeURIComponent(q)}`;

        const data = await apiFetch(url);

        state.posts =
            normalizePosts(
                Array.isArray(data)
                    ? data
                    : data?.posts || []
            );

        renderFeed();

    } catch (error) {

        /*
         * Если backend пока не реализовал отдельный
         * endpoint поиска, можно временно искать
         * в уже загруженных постах.
         */

        if (state.posts.length) {

            const lower = q.toLowerCase();

            const result =
                state.posts.filter(post => {

                    return [
                        post.title,
                        post.author_name,
                        post.prompt,
                        post.answer
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase()
                        .includes(lower);
                });

            renderPosts(result);

        } else {

            renderError(
                "Поиск временно недоступен."
            );
        }
    }
}


/* =========================================================
   NORMALIZE POSTS
========================================================= */

function normalizePosts(posts) {

    return posts.map(post => {

        return {
            id: post.id,

            title:
                post.title ||
                createTitleFromPrompt(
                    post.prompt || ""
                ),

            author_name:
                post.author_name ||
                post.author ||
                "Аноним",

            prompt:
                post.prompt ||
                post.request ||
                "",

            answer:
                post.answer ||
                post.response ||
                "",

            files:
                Array.isArray(post.files)
                    ? post.files
                    : [],

            likes:
                Number(post.likes || 0),

            views:
                Number(post.views || 0),

            model:
                post.model ||
                post.model_name ||
                "",

            created_at:
                post.created_at ||
                post.createdAt ||
                null,

            /*
             * Backend может вернуть эти поля.
             */
            liked:
                Boolean(
                    post.liked ||
                    hasReaction("like", post.id)
                ),

            disliked:
                Boolean(
                    post.disliked ||
                    hasReaction("dislike", post.id)
                )
        };
    });
}


/* =========================================================
   TITLE FALLBACK
========================================================= */

function createTitleFromPrompt(prompt) {

    const clean =
        String(prompt)
            .replace(/\s+/g, " ")
            .trim();

    if (!clean) {
        return "Без названия";
    }

    if (clean.length <= 70) {
        return clean;
    }

    return clean.slice(0, 67) + "...";
}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed() {

    renderPosts(state.posts);
}


function renderPosts(posts) {

    if (!posts.length) {

        feed.innerHTML = `
            <div class="empty-box">
                Постов пока нет.
            </div>
        `;

        return;
    }

    feed.innerHTML =
        posts.map(
            post => createPostCard(post)
        ).join("");
}


function createPostCard(post) {

    const avatar =
        getAvatarLetter(
            post.author_name
        );

    const time =
        formatDate(post.created_at);

    const prompt =
        escapeHtml(post.prompt);

    const answer =
        escapeHtml(post.answer);

    const files =
        renderFileStrip(post.files);

    const liked =
        post.liked ||
        hasReaction("like", post.id);

    const disliked =
        post.disliked ||
        hasReaction("dislike", post.id);

    return `
        <article
            class="post-card"
            data-post-id="${escapeAttribute(post.id)}"
            tabindex="0"
            role="button"
        >

            <div class="post-meta">

                <div class="author-line">

                    <div class="author-avatar">
                        ${escapeHtml(avatar)}
                    </div>

                    <div class="author-name">
                        ${escapeHtml(post.author_name)}
                    </div>

                    <div class="post-time">
                        · ${escapeHtml(time)}
                    </div>

                </div>

            </div>

            <h2 class="post-title">
                ${escapeHtml(post.title)}
            </h2>

            <p class="post-prompt">
                ${prompt}
            </p>

            ${files}

            ${
                answer
                    ? `
                        <div class="post-answer-preview">
                            ${answer}
                        </div>
                    `
                    : ""
            }

            <div
                class="post-footer"
                data-reaction-container
            >

                <button
                    class="reaction-button ${liked ? "active" : ""}"
                    type="button"
                    data-action="like"
                    data-id="${escapeAttribute(post.id)}"
                >
                    👍
                    <span>${post.likes}</span>
                </button>

                <button
                    class="reaction-button dislike-button ${disliked ? "active" : ""}"
                    type="button"
                    data-action="dislike"
                    data-id="${escapeAttribute(post.id)}"
                >
                    👎
                </button>

                <div class="reaction-button">
                    👁
                    <span>${post.views}</span>
                </div>

                ${
                    post.model
                        ? `
                            <div class="model-badge">
                                ${escapeHtml(post.model)}
                            </div>
                        `
                        : ""
                }

            </div>

        </article>
    `;
}


/* =========================================================
   FILE STRIP
========================================================= */

function renderFileStrip(files) {

    if (!files || !files.length) {
        return "";
    }

    return `
        <div
            class="files-strip"
            data-files-strip
            onclick="event.stopPropagation()"
        >
            ${
                files.map(
                    file => renderMiniFile(file)
                ).join("")
            }
        </div>
    `;
}


function renderMiniFile(file) {

    const url =
        getFileUrl(file);

    const name =
        file.name ||
        file.filename ||
        "Файл";

    const isImage =
        file.is_image ||
        isImageFile(
            name,
            file.mime_type ||
            file.type ||
            ""
        );

    if (isImage && url) {

        return `
            <div class="file-mini image">
                <img
                    src="${escapeAttribute(url)}"
                    alt="${escapeAttribute(name)}"
                    loading="lazy"
                >
            </div>
        `;
    }

    return `
        <div class="file-mini">

            <div class="file-mini-icon">
                ${getFileIcon(name)}
            </div>

            <div class="file-mini-name">
                ${escapeHtml(name)}
            </div>

        </div>
    `;
}


/* =========================================================
   FULL POST
========================================================= */

async function openPost(postId) {

    state.currentPostId = postId;

    postOverlay.classList.add("open");
    postOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow = "hidden";

    fullPostContent.innerHTML = `
        <div class="loading-box">
            Загружаем пост...
        </div>
    `;

    let post =
        state.posts.find(
            item => String(item.id) === String(postId)
        );

    try {

        const data =
            await apiFetch(
                `${API.posts}/${encodeURIComponent(postId)}`
            );

        post =
            normalizePosts([
                data?.post || data
            ])[0] || post;

    } catch (error) {

        /*
         * Если GET конкретного поста пока не сделан,
         * используем уже загруженную карточку.
         */
    }

    if (!post) {

        fullPostContent.innerHTML = `
            <div class="error-box">
                Пост не найден.
            </div>
        `;

        return;
    }

    renderFullPost(post);

    /*
     * Просмотр засчитывается только один раз
     * за sessionStorage-сессию.
     */
    await registerView(post);

}


/* =========================================================
   REGISTER VIEW
========================================================= */

async function registerView(post) {

    if (
        hasReaction("view", post.id)
    ) {
        return;
    }

    saveReaction(
        "view",
        post.id
    );

    /*
     * Оптимистично увеличиваем локально.
     */
    post.views =
        Number(post.views || 0) + 1;

    try {

        const data =
            await apiFetch(
                API.view(post.id),
                {
                    method: "POST"
                }
            );

        if (data?.views !== undefined) {
            post.views = Number(data.views);
        }

        renderFullPost(post);

    } catch (error) {

        console.warn(
            "Не удалось записать просмотр",
            error
        );
    }
}


/* =========================================================
   FULL POST RENDER
========================================================= */

function renderFullPost(post) {

    const liked =
        post.liked ||
        hasReaction("like", post.id);

    const disliked =
        post.disliked ||
        hasReaction("dislike", post.id);

    fullPostContent.innerHTML = `

        <h1 class="full-post-title">
            ${escapeHtml(post.title)}
        </h1>

        <div class="full-post-meta">
            ${escapeHtml(post.author_name)}
            ·
            ${escapeHtml(formatDate(post.created_at))}
        </div>

        <div class="section-label">
            Запрос
        </div>

        <div class="full-prompt">
            ${escapeHtml(post.prompt)}
        </div>

        ${
            post.files && post.files.length
                ? `
                    <div class="section-label">
                        Файлы
                    </div>

                    <div class="full-files">
                        ${
                            post.files
                                .map(
                                    file =>
                                        renderFullFile(file)
                                )
                                .join("")
                        }
                    </div>
                `
                : ""
        }

        <div class="section-label">
            Ответ ИИ
        </div>

        <div class="full-answer">
            ${escapeHtml(post.answer)}
        </div>

        <div class="post-details-footer">

            <button
                class="reaction-button ${liked ? "active" : ""}"
                type="button"
                data-full-action="like"
                data-id="${escapeAttribute(post.id)}"
            >
                👍
                <span>${post.likes}</span>
            </button>

            <button
                class="reaction-button dislike-button ${disliked ? "active" : ""}"
                type="button"
                data-full-action="dislike"
                data-id="${escapeAttribute(post.id)}"
            >
                👎
            </button>

            <div class="reaction-button">
                👁
                <span>${post.views}</span>
            </div>

            ${
                post.model
                    ? `
                        <div class="model-info">
                            Модель: ${escapeHtml(post.model)}
                        </div>
                    `
                    : ""
            }

        </div>
    `;
}


function renderFullFile(file) {

    const url =
        getFileUrl(file);

    const name =
        file.name ||
        file.filename ||
        "Файл";

    const type =
        file.mime_type ||
        file.type ||
        getFileExtension(name);

    const isImage =
        file.is_image ||
        isImageFile(name, type);

    if (isImage && url) {

        return `
            <a
                class="full-file"
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener"
            >

                <img
                    class="full-file-image"
                    src="${escapeAttribute(url)}"
                    alt="${escapeAttribute(name)}"
                >

                <div class="full-file-info">

                    <div class="full-file-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="full-file-type">
                        ${escapeHtml(type)}
                    </div>

                </div>

            </a>
        `;
    }

    return `
        <a
            class="full-file"
            href="${escapeAttribute(url || "#")}"
            target="_blank"
            rel="noopener"
        >

            <div class="full-file-document">
                ${getFileIcon(name)}
            </div>

            <div class="full-file-info">

                <div class="full-file-name">
                    ${escapeHtml(name)}
                </div>

                <div class="full-file-type">
                    ${escapeHtml(type)}
                </div>

            </div>

        </a>
    `;
}


/* =========================================================
   LIKE / DISLIKE
========================================================= */

async function likePost(postId) {

    if (hasReaction("like", postId)) {
        return;
    }

    const post =
        state.posts.find(
            item => String(item.id) === String(postId)
        );

    if (!post) {
        return;
    }

    saveReaction("like", postId);

    post.liked = true;
    post.likes =
        Number(post.likes || 0) + 1;

    renderFeed();

    if (
        state.currentPostId &&
        String(state.currentPostId) === String(postId)
    ) {
        renderFullPost(post);
    }

    try {

        const data =
            await apiFetch(
                API.like(postId),
                {
                    method: "POST"
                }
            );

        if (data?.likes !== undefined) {

            post.likes =
                Number(data.likes);

            renderFeed();

            if (
                state.currentPostId &&
                String(state.currentPostId) === String(postId)
            ) {
                renderFullPost(post);
            }
        }

    } catch (error) {

        console.warn(
            "Ошибка лайка",
            error
        );

        /*
         * Локально лайк уже отмечен.
         * Если backend вернул ошибку,
         * откатываем состояние.
         */
        sessionStorage.removeItem(
            getReactionKey("like", postId)
        );

        post.liked = false;

        post.likes =
            Math.max(
                0,
                Number(post.likes || 1) - 1
            );

        renderFeed();

        if (
            state.currentPostId &&
            String(state.currentPostId) === String(postId)
        ) {
            renderFullPost(post);
        }
    }
}


async function dislikePost(postId) {

    if (hasReaction("dislike", postId)) {
        return;
    }

    saveReaction(
        "dislike",
        postId
    );

    const post =
        state.posts.find(
            item => String(item.id) === String(postId)
        );

    if (post) {

        post.disliked = true;

        renderFeed();

        if (
            state.currentPostId &&
            String(state.currentPostId) === String(postId)
        ) {
            renderFullPost(post);
        }
    }

    try {

        await apiFetch(
            API.dislike(postId),
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.warn(
            "Ошибка дизлайка",
            error
        );

        sessionStorage.removeItem(
            getReactionKey("dislike", postId)
        );

        if (post) {

            post.disliked = false;

            renderFeed();

            if (
                state.currentPostId &&
                String(state.currentPostId) === String(postId)
            ) {
                renderFullPost(post);
            }
        }
    }
}


/* =========================================================
   NEW POST MODAL
========================================================= */

function openNewPost() {

    newPostOverlay.classList.add("open");

    newPostOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow = "hidden";

    startCooldownTimer();

    setTimeout(
        () => authorName.focus(),
        80
    );
}


function closeNewPostModal() {

    /*
     * Нельзя закрывать во время отправки.
     * Пользователь должен дождаться результата.
     */
    if (
        sendButton.disabled &&
        submitStatus.classList.contains("visible")
    ) {
        return;
    }

    newPostOverlay.classList.remove("open");

    newPostOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow = "";

    clearSubmitState();
}


/* =========================================================
   NEW POST
========================================================= */

async function submitPost(event) {

    event.preventDefault();

    const name =
        authorName.value.trim();

    const prompt =
        promptInput.value.trim();

    if (!name) {

        authorName.focus();

        return;
    }

    if (!prompt) {

        promptInput.focus();

        return;
    }

    if (isCooldownActive()) {

        startCooldownTimer();

        return;
    }

    if (
        state.selectedFiles.length >
        CONFIG.maxFiles
    ) {

        showSubmitError(
            `Можно прикрепить не более ${CONFIG.maxFiles} файлов.`
        );

        return;
    }

    const totalSize =
        state.selectedFiles.reduce(
            (sum, file) =>
                sum + file.size,
            0
        );

    if (
        totalSize >
        CONFIG.maxClientTotalSize
    ) {

        showSubmitError(
            "Общий размер файлов слишком большой."
        );

        return;
    }

    for (
        const file of state.selectedFiles
    ) {

        if (
            file.size >
            CONFIG.maxClientFileSize
        ) {

            showSubmitError(
                `Файл «${file.name}» слишком большой.`
            );

            return;
        }
    }

    const formData =
        new FormData();

    formData.append(
        "name",
        name
    );

    formData.append(
        "author_name",
        name
    );

    formData.append(
        "prompt",
        prompt
    );

    formData.append(
        "session_id",
        SESSION_ID
    );

    for (
        const file of state.selectedFiles
    ) {

        formData.append(
            "files",
            file,
            file.name
        );
    }

    sendButton.disabled = true;

    attachButton.disabled = true;
    attachButtonBottom.disabled = true;

    submitStatus.classList.add(
        "visible"
    );

    submitStatus.textContent =
        "Отправляем запрос в ИИ...";

    try {

        const data =
            await apiFetch(
                API.create,
                {
                    method: "POST",
                    body: formData
                }
            );

        /*
         * Сервер успешно принял запрос.
         * Теперь запускаем cooldown.
         */
        setCooldown();

        submitStatus.textContent =
            "Готово. Пост добавлен.";

        /*
         * Если backend сразу вернул пост,
         * добавляем его в начало.
         */
        const createdPost =
            data?.post ||
            (
                data?.id
                    ? data
                    : null
            );

        if (createdPost) {

            const normalized =
                normalizePosts([
                    createdPost
                ])[0];

            state.posts.unshift(
                normalized
            );
        }

        /*
         * Обновляем ленту с сервера.
         */
        await loadFeed();

        /*
         * Закрываем окно после небольшой паузы.
         */
        setTimeout(
            () => {

                closeNewPostModal();

                sendButton.disabled = false;
                attachButton.disabled = false;
                attachButtonBottom.disabled = false;

            },
            650
        );

    } catch (error) {

        console.error(error);

        /*
         * 429 может прийти от backend,
         * если cooldown уже существует.
         */
        if (
            error.status === 429
        ) {

            const seconds =
                Number(
                    error.data?.retry_after ||
                    error.data?.retryAfter ||
                    30
                );

            setCooldown(
                seconds
            );

            showSubmitError(
                `Слишком часто. Попробуйте через ${seconds} сек.`
            );

        } else {

            showSubmitError(
                error.message ||
                "Не удалось отправить запрос."
            );
        }

        sendButton.disabled = false;
        attachButton.disabled = false;
        attachButtonBottom.disabled = false;
    }
}


/* =========================================================
   FILE INPUT
========================================================= */

function handleFiles(files) {

    const incoming =
        Array.from(files);

    for (
        const file of incoming
    ) {

        if (
            state.selectedFiles.length >=
            CONFIG.maxFiles
        ) {
            break;
        }

        /*
         * Не добавляем один и тот же файл
         * дважды по имени + размеру.
         */
        const exists =
            state.selectedFiles.some(
                existing =>
                    existing.name === file.name &&
                    existing.size === file.size &&
                    existing.lastModified === file.lastModified
            );

        if (!exists) {

            state.selectedFiles.push(
                file
            );
        }
    }

    renderSelectedFiles();

    fileInput.value = "";
}


function renderSelectedFiles() {

    if (!state.selectedFiles.length) {

        selectedFiles.innerHTML = "";

        return;
    }

    selectedFiles.innerHTML =
        state.selectedFiles
            .map(
                (file, index) => `
                    <div class="selected-file">

                        <span>
                            ${getFileIcon(file.name)}
                        </span>

                        <span class="selected-file-name">
                            ${escapeHtml(file.name)}
                        </span>

                        <span>
                            ${formatBytes(file.size)}
                        </span>

                        <button
                            class="remove-file"
                            type="button"
                            data-remove-file="${index}"
                            aria-label="Удалить файл"
                        >
                            ×
                        </button>

                    </div>
                `
            )
            .join("");
}


function removeSelectedFile(index) {

    state.selectedFiles.splice(
        index,
        1
    );

    renderSelectedFiles();
}


/* =========================================================
   COOLDOWN
========================================================= */

function setCooldown(seconds = CONFIG.cooldownSeconds) {

    const until =
        Date.now() +
        seconds * 1000;

    state.cooldownUntil =
        until;

    localStorage.setItem(
        "chatstudio_cooldown_until",
        String(until)
    );

    startCooldownTimer();
}


function isCooldownActive() {

    return (
        state.cooldownUntil >
        Date.now()
    );
}


function startCooldownTimer() {

    clearInterval(
        state.cooldownTimer
    );

    const update =
        () => {

            const remaining =
                Math.max(
                    0,
                    Math.ceil(
                        (
                            state.cooldownUntil -
                            Date.now()
                        ) / 1000
                    )
                );

            if (remaining > 0) {

                cooldownBox.classList.add(
                    "visible"
                );

                cooldownValue.textContent =
                    remaining;

                sendButton.disabled = true;

            } else {

                cooldownBox.classList.remove(
                    "visible"
                );

                /*
                 * Не включаем кнопку,
                 * если сейчас идёт отправка.
                 */
                if (
                    !submitStatus.textContent.includes(
                        "Отправляем"
                    )
                ) {
                    sendButton.disabled = false;
                }

                clearInterval(
                    state.cooldownTimer
                );
            }
        };

    update();

    if (isCooldownActive()) {

        state.cooldownTimer =
            setInterval(
                update,
                250
            );
    }
}


/* =========================================================
   SUBMIT STATUS
========================================================= */

function showSubmitError(message) {

    submitStatus.classList.add(
        "visible"
    );

    submitStatus.textContent =
        message;

    submitStatus.style.color =
        "#a44e46";
}


function clearSubmitState() {

    submitStatus.classList.remove(
        "visible"
    );

    submitStatus.textContent = "";

    submitStatus.style.color = "";

    state.selectedFiles = [];

    renderSelectedFiles();

    newPostForm.reset();

    attachButton.disabled = false;
    attachButtonBottom.disabled = false;

    startCooldownTimer();
}


/* =========================================================
   CLOSE POST
========================================================= */

function closePostModal() {

    postOverlay.classList.remove(
        "open"
    );

    postOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow = "";

    state.currentPostId = null;
}


/* =========================================================
   EVENT DELEGATION — FEED
========================================================= */

feed.addEventListener(
    "click",
    async event => {

        const reaction =
            event.target.closest(
                "[data-action]"
            );

        if (reaction) {

            event.stopPropagation();

            const action =
                reaction.dataset.action;

            const id =
                reaction.dataset.id;

            if (action === "like") {

                await likePost(id);

            } else if (
                action === "dislike"
            ) {

                await dislikePost(id);
            }

            return;
        }

        const card =
            event.target.closest(
                ".post-card"
            );

        if (!card) {
            return;
        }

        const id =
            card.dataset.postId;

        openPost(id);
    }
);


/* =========================================================
   EVENT DELEGATION — FULL POST
========================================================= */

fullPostContent.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "[data-full-action]"
            );

        if (!button) {
            return;
        }

        const action =
            button.dataset.fullAction;

        const id =
            button.dataset.id;

        if (action === "like") {

            await likePost(id);

        } else if (
            action === "dislike"
        ) {

            await dislikePost(id);
        }
    }
);


/* =========================================================
   FILE REMOVE
========================================================= */

selectedFiles.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                "[data-remove-file]"
            );

        if (!button) {
            return;
        }

        removeSelectedFile(
            Number(
                button.dataset.removeFile
            )
        );
    }
);


/* =========================================================
   SEARCH EVENTS
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        const value =
            searchInput.value;

        clearSearch.style.display =
            value
                ? "block"
                : "none";

        clearTimeout(
            state.searchTimer
        );

        state.searchTimer =

clearSearch.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        clearSearch.style.display =
            "none";

        loadFeed();

    }

/* =========================================================
   BUTTON EVENTS
========================================================= */

document
    .getElementById("headerNewButton")
    .addEventListener(
        "click",
        openNewPost
    );

document
    .getElementById("floatingNewButton")
    .addEventListener(
        "click",
        openNewPost
    );

refreshButton.addEventListener(
    "click",
    loadFeed
);

attachButton.addEventListener(

);

attachButtonBottom.addEventListener(
    "click",

);

fileInput.addEventListener(

);

closeNewPost.addEventListener(

/* =========================================================
   OVERLAY CLICK
========================================================= */

newPostOverlay.addEventListener(
    "click",

        if (

        ) {
            closeNewPostModal();
        }
    }

postOverlay.addEventListener(
    "click",

        if (
            event.target ===

        ) {

        }
    }

/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {
            return;
        }

        if (
            postOverlay.classList.contains(
                "open"
            )
        ) {

            closePostModal();

            return;
        }

        if (
            newPostOverlay.classList.contains(

);

   BRAND
========================================================= */

document
    .getElementById("brandLink")

            searchInput.value = "";

/* =========================================================
   HELPERS
========================================================= */

function renderLoading() {

    feed.innerHTML = `
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    `;
}


function renderError(message) {

    feed.innerHTML = `
        <div class="error-box">
            ${escapeHtml(message)}
        </div>
    `;
}


function getAvatarLetter(name) {

    const clean =
        String(name || "А")
            .trim();

    return clean
        ? clean.charAt(0).toUpperCase()
        : "А";
}


function formatDate(value) {

    if (!value) {
        return "только что";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "только что";
    }

    const diff =
        Date.now() -
        date.getTime();

    const minute =
        60 * 1000;

    const hour =
        60 * minute;

    const day =
        24 * hour;

    if (diff < minute) {
        return "только что";
    }

    if (diff < hour) {

        return (
            Math.floor(diff / minute) +
            " мин назад"
        );
    }

    if (diff < day) {

        return (
            Math.floor(diff / hour) +
            " ч назад"
        );
    }

    if (diff < 7 * day) {

        return (
            Math.floor(diff / day) +
            " дн назад"
        );
    }

    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatBytes(bytes) {

    if (!bytes) {
        return "0 Б";
    }

    const units = [
        "Б",
        "КБ",
        "МБ",
        "ГБ"
    ];

    let value =
        Number(bytes);

    let unit =
        0;

    while (
        value >= 1024 &&
        unit < units.length - 1
    ) {

        value /= 1024;
        unit++;
    }

    return (
        value < 10 && unit > 0
            ? value.toFixed(1)
            : Math.round(value)
    ) + " " + units[unit];
}


function getFileExtension(name) {

    const parts =
        String(name)
            .split(".");

    if (parts.length < 2) {
        return "Файл";
    }

    return parts
        .pop()
        .toUpperCase();
}


function getFileIcon(name) {

    const ext =
        getFileExtension(name);

    const map = {
        PDF: "📄",
        DOC: "📄",
        DOCX: "📄",
        TXT: "📝",
        CSV: "📊",
        XLS: "📊",
        XLSX: "📊",
        PPT: "📊",
        PPTX: "📊",
        ZIP: "🗜️",
        RAR: "🗜️",
        PNG: "🖼️",
        JPG: "🖼️",
        JPEG: "🖼️",
        WEBP: "🖼️",
        GIF: "🖼️",
        MP3: "🎵",
        WAV: "🎵",
        MP4: "🎬",
        MOV: "🎬"
    };

    return map[ext] || "📎";
}


function isImageFile(
    name,
    mime
) {

    if (
        String(mime)
            .toLowerCase()
            .startsWith("image/")
    ) {
        return true;
    }

    return [
        "jpg",
        "jpeg",
        "png",
        "gif",
        "webp",
        "bmp",
        "svg"
    ].includes(
        getFileExtension(name).toLowerCase()
    );
}


function getFileUrl(file) {

    if (!file) {
        return "";
    }

    return (
        file.url ||
        file.download_url ||
        file.path ||
        file.file_url ||
        ""
    );
}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}


/* =========================================================
   INIT
========================================================= */

startCooldownTimer();

loadFeed();

</script>
